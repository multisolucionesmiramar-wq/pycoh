[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycoh"
version = "0.1.0"
description = "Adaptador CoH para transformers: corrección direccional en el residual stream con el modelo base congelado"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Franklin Moisés Ramírez Azofeifa" }]
keywords = ["pytorch", "transformers", "peft", "fine-tuning", "adapter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
integration = ["transformers>=4.40", "accelerate>=0.30"]

[project.urls]
Homepage = "https://github.com/multisolucionesmiramar-wq/pycoh"
Issues = "https://github.com/multisolucionesmiramar-wq/pycoh/issues"

[tool.setuptools.packages.find]
include = ["pycoh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
